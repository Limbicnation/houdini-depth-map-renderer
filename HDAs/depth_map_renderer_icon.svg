<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="depthGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="35%" stop-color="#4a148c"/>
      <stop offset="70%" stop-color="#006064"/>
      <stop offset="100%" stop-color="#e0f7fa"/>
    </linearGradient>
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#aa00ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" fill="#0d0d0d" rx="8"/>

  <!-- Depth gradient planes (back to front) -->
  <rect x="16" y="16" width="96" height="96" fill="url(#depthGrad)" opacity="0.15" rx="4"/>
  <rect x="24" y="24" width="80" height="80" fill="url(#depthGrad)" opacity="0.25" rx="4"/>
  <rect x="32" y="32" width="64" height="64" fill="url(#depthGrad)" opacity="0.4" rx="4"/>
  <rect x="40" y="40" width="48" height="48" fill="url(#depthGrad)" opacity="0.6" rx="4"/>
  <rect x="48" y="48" width="32" height="32" fill="url(#depthGrad)" opacity="0.85" rx="3"/>

  <!-- Wireframe cube -->
  <g fill="none" stroke="url(#wireGrad)" stroke-width="1.2" filter="url(#glow)">
    <!-- Back face -->
    <path d="M44 36 L84 36 L84 76 L44 76 Z" opacity="0.4"/>
    <!-- Front face -->
    <path d="M36 52 L76 52 L76 92 L36 92 Z"/>
    <!-- Connecting edges (depth lines) -->
    <line x1="44" y1="36" x2="36" y2="52" opacity="0.5"/>
    <line x1="84" y1="36" x2="76" y2="52" opacity="0.5"/>
    <line x1="84" y1="76" x2="76" y2="92" opacity="0.5"/>
    <line x1="44" y1="76" x2="36" y2="92" opacity="0.5"/>
  </g>

  <!-- Z-depth arrow -->
  <g fill="none" stroke="#00e5ff" stroke-width="1.5" filter="url(#glow)">
    <line x1="92" y1="92" x2="108" y2="108"/>
    <polyline points="102,108 108,108 108,102" fill="none"/>
  </g>
  <text x="114" y="120" fill="#00e5ff" font-family="monospace" font-size="8" opacity="0.7">Z</text>

  <!-- Corner accent -->
  <polyline points="8,24 8,8 24,8" fill="none" stroke="#aa00ff" stroke-width="1.5" opacity="0.6"/>
</svg>